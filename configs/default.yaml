# UnFakeable - default experiment.
# v0.3 changes (after the first real run scored ~0.5 AUC): 400 real + 400 fake FF++ videos, multi-layer texture
# features from the frozen EfficientNet-B0, and frame-level training with a video-level decision.
# Paths are relative to the project folder; change them if your data lives elsewhere.
run_name: ffpp_to_celebdf
seed: 42
note: ""

paths:
  ffpp_root: data/FaceForensics++     # must contain original_sequences/ and manipulated_sequences/
  celebdf_root: data/Celeb-DF-v2      # must contain Celeb-real/, Celeb-synthesis/, YouTube-real/, List_of_testing_videos.txt
  artifacts_dir: artifacts            # results: artifacts/<run_name>/
  cache_dir: cache                    # face crops + embeddings (safe to delete, rebuilt on demand)
  weights_dir: weights

data:
  ffpp_compression: c23
  ffpp_fake_methods: [Deepfakes, Face2Face, FaceSwap, NeuralTextures]
  ffpp_max_real: 400                  # uses up to 400 real videos (fewer if fewer are downloaded); fakes matched 1:1
  test_size: 0.2                      # 20 % of FF++ source groups held out
  celebdf_use_official_test_list: true
  celebdf_max_per_class: 100          # null = whole official test list (518 videos)

preproc:
  n_frames: 16
  face_size: 224
  margin: 0.3
  detect_max_side: 640
  mtcnn_min_confidence: 0.9
  use_mediapipe_fallback: true        # only used if the optional mediapipe package is installed
  min_face_ratio: 0.5
  device: auto                        # auto = RTX 3050 when the CUDA build of PyTorch is installed

spatial:
  backbone_source: auto               # torchvision ImageNet EfficientNet-B0 (GitHub mirror as fallback)
  layers: multi                       # final pooled features + texture statistics of 4 intermediate blocks
  batch_size: 64                      # lower to 32 if you ever see CUDA out-of-memory
  device: auto

temporal:
  enabled: true
  cell: lstm                          # or gru
  input_mode: diff
  hidden_size: 128
  epochs: 30
  lr: 0.001
  device: auto

fusion:
  n_components: 64
  block_weighting: sqrt_dim

feature_sets: [spatial, fused, handcrafted, all]

train:
  granularity: frame                  # classify each frame, average the probabilities per video
  frames_per_video: 8                 # frames per TRAINING video (all 16 are used when testing)

tuning:
  cv_folds: 5
  n_jobs: -1                          # Random Forest / XGBoost use all CPU cores

gradcam:
  enabled: true
  videos_per_class: 3
  frames_per_video: 4

robustness:
  enabled: true
  max_videos_per_set: 100
  feature_sets: [spatial, fused]
