# Everything that is on disk: all downloaded FF++ videos and the whole Celeb-DF v2 test list (518 videos).
# Slower (more videos to preprocess and a bigger SVM). Reuses the face/embedding cache of the default run.
#   python -m unfakeable.cli all --config configs/large.yaml
run_name: ffpp_to_celebdf_large
seed: 42

paths:
  ffpp_root: data/FaceForensics++
  celebdf_root: data/Celeb-DF-v2

data:
  ffpp_max_real: null
  celebdf_max_per_class: null

preproc:
  device: auto
spatial:
  layers: multi
  device: auto
temporal:
  device: auto

feature_sets: [spatial, fused, handcrafted, all]

train:
  granularity: frame
  frames_per_video: 8

tuning:
  n_jobs: -1
